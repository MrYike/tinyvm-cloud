<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework Linux</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d18;color:#fff;font-family:system-ui,sans-serif}iframe{width:100%;height:100%;border:0;display:none}.loading{height:100%;display:grid;place-items:center;text-align:center}.box{max-width:520px;padding:30px}.spin{width:46px;height:46px;border:5px solid #263650;border-top-color:#5ee1bc;border-radius:50%;margin:0 auto 22px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#aebbd1}</style></head><body><div id="loading" class="loading"><div class="box"><div class="spin"></div><h1>Connecting securely…</h1><p id="message">Preparing the Vercel desktop relay.</p></div></div><iframe id="desktop" allow="autoplay; clipboard-read; clipboard-write; fullscreen"></iframe><script>const frame=document.querySelector('#desktop'),loading=document.querySelector('#loading'),message=document.querySelector('#message');async function connect(){try{const r=await fetch('/api/tunnel-info',{cache:'no-store'});if(r.status===401){location.replace('/');return}const d=await r.json();if(!r.ok)throw new Error(d.error);frame.src=d.url+'/?token='+encodeURIComponent(d.token);frame.onload=()=>{loading.style.display='none';frame.style.display='block'};setTimeout(()=>{if(frame.style.display!=='block')message.textContent='The desktop is taking longer than usual. Still trying…'},10000)}catch(e){message.textContent=e.message;setTimeout(connect,4000)}}connect()</script></body></html>
