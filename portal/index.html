<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TinyVM Cloud</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#1d3d70 0,transparent 38%),#050b16;color:#f5f7ff}
    main{width:min(520px,100%);padding:44px;border:1px solid #31466b;border-radius:32px;background:#0d1728;box-shadow:0 28px 80px #0008}
    .tag{display:inline-block;padding:8px 14px;border-radius:999px;background:#14483f;color:#69e4c1}
    h1{margin:22px 0 10px;font-size:clamp(42px,9vw,68px);line-height:.95}
    p{color:#b8c6e2;font-size:18px;line-height:1.55}
    label{display:block;margin:28px 0 10px;font-size:18px}
    input,button{width:100%;min-height:60px;border-radius:16px;font:inherit}
    input{padding:0 18px;border:1px solid #40557c;background:#091221;color:#fff;font-size:20px}
    button{margin-top:16px;border:0;background:#62dfbd;color:#06130f;font-size:20px;font-weight:800;cursor:pointer}
    button:hover{background:#7be8c9}
    #message{min-height:24px;margin:12px 2px 0;color:#ff9ca8;font-size:15px}
    .note{margin-top:26px;font-size:14px;color:#8190ad}
  </style>
</head>
<body>
  <main>
    <span class="tag">GitHub Codespaces</span>
    <h1>TinyVM Cloud</h1>
    <p>Enter the password to open your Linux desktop.</p>
    <form id="gate">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" autofocus>
      <button type="submit">Open Linux desktop</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
    <p class="note">The Codespace must be running for the desktop to connect.</p>
  </main>
  <script>
    const desktopUrl="https://psychic-cod-wrxrgwg6j557hg6p7-6080.app.github.dev/vnc.html?autoconnect=1&resize=scale&reconnect=1&reconnect_delay=3000&quality=9&compression=2";
    document.getElementById("gate").addEventListener("submit",event=>{
      event.preventDefault();
      const field=document.getElementById("password");
      if(field.value==="123456"){
        location.href=desktopUrl;
      }else{
        document.getElementById("message").textContent="Incorrect password";
        field.select();
      }
    });
  </script>
</body>
</html>
