<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework</title><style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#19345e 0,#09111f 46%,#050912 100%);color:#f5f7ff}.card{width:min(92vw,500px);padding:44px;border:1px solid #30456b;border-radius:28px;background:#0e1727dd;box-shadow:0 32px 90px #0008}.tag{display:inline-block;padding:8px 14px;border-radius:999px;background:#133e37;color:#67e8c7;font-weight:700}h1{font-size:clamp(42px,8vw,70px);margin:20px 0 10px;letter-spacing:-.05em}p{color:#b9c6dd;line-height:1.55}label{display:block;margin:28px 0 10px;font-weight:700}input{width:100%;font:inherit;font-size:20px;padding:18px;border-radius:16px;border:1px solid #425779;background:#08111f;color:#fff;outline:none}input:focus{border-color:#5ee1bc;box-shadow:0 0 0 4px #5ee1bc22}button{width:100%;margin-top:18px;padding:17px;border:0;border-radius:16px;background:#5ee1bc;color:#052019;font:inherit;font-size:19px;font-weight:850;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{min-height:24px;margin-top:14px;color:#ff9c9c;font-weight:650}.small{font-size:13px;color:#7e90ad}</style></head><body><main class="card"><span class="tag">Private study desktop</span><h1>Homework</h1><p>Enter the password to open your management page.</p><form id="login"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Continue</button><div id="message" class="message" role="alert"></div></form><p class="small">Protected by an encrypted HTTPS connection and server-side login.</p></main><script>const form=document.querySelector('#login'),button=document.querySelector('#submit'),message=document.querySelector('#message');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='Checking…';try{const response=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const data=await response.json();if(response.ok){location.replace('/manage.html');return}if(data.redirect){location.replace(data.redirect);return}message.textContent=data.error||'Could not sign in.'}catch{message.textContent='The login service is temporarily unavailable.'}finally{button.disabled=false}});</script></body></html>
