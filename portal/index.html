<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TinyVM Cloud</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 0%, #243b66, #070b14 55%); color: #f5f7fb; }
    main { width: min(92vw, 560px); padding: 32px; border: 1px solid #33415f; border-radius: 24px; background: #111827e8; box-shadow: 0 24px 80px #0008; }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 7vw, 52px); letter-spacing: -2px; }
    p { color: #aebbd1; line-height: 1.55; }
    label { display: block; margin: 16px 0 6px; color: #cbd5e1; }
    input, button, a.launch { width: 100%; border-radius: 12px; padding: 13px 15px; font: inherit; }
    input { border: 1px solid #41506d; background: #0b1220; color: white; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    button, a.launch { border: 0; background: #5ee0b7; color: #052117; font-weight: 750; cursor: pointer; text-align: center; text-decoration: none; }
    button.secondary { background: #26344f; color: #e5e7eb; }
    #session { display: none; }
    #status { min-height: 24px; color: #f8c66d; }
    .tag { display: inline-block; padding: 5px 9px; border-radius: 999px; background: #173e35; color: #74e6c1; font-size: 13px; }
    small { display: block; margin-top: 14px; color: #7f8ca5; }
  </style>
</head>
<body>
  <main>
    <span class="tag">GitHub Codespaces + QEMU</span>
    <h1>TinyVM Cloud</h1>
    <p>Your 40 GB Windows 11 ARM virtual machine runs in a GitHub Codespace and opens in the browser through noVNC.</p>

    <section id="auth">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters">
      <div class="actions">
        <button id="signin">Sign in</button>
        <button id="signup" class="secondary">Create account</button>
      </div>
    </section>

    <section id="session">
      <p id="identity"></p>
      <a class="launch" href="https://psychic-cod-wrxrgwg6j557hg6p7-6080.app.github.dev/vnc.html?autoconnect=1&resize=scale" target="_blank" rel="noopener">Open Windows desktop</a>
      <button id="signout" class="secondary" style="margin-top:10px">Sign out</button>
      <small>The desktop link is additionally protected by your GitHub login because the forwarded Codespace port is private.</small>
    </section>
    <p id="status" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://bjestdprtciykflpnutk.supabase.co',
      'sb_publishable_gLI4KS77_LAisZYXAhIg3Q_Q6VJVtC0'
    );

    const auth = document.querySelector('#auth');
    const session = document.querySelector('#session');
    const status = document.querySelector('#status');
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');

    function render(current) {
      auth.style.display = current ? 'none' : 'block';
      session.style.display = current ? 'block' : 'none';
      document.querySelector('#identity').textContent = current ? `Signed in as ${current.user.email}` : '';
    }

    async function submit(mode) {
      status.textContent = 'Working…';
      const credentials = { email: email.value.trim(), password: password.value };
      const result = mode === 'signup'
        ? await supabase.auth.signUp(credentials)
        : await supabase.auth.signInWithPassword(credentials);
      status.textContent = result.error ? result.error.message : mode === 'signup' && !result.data.session ? 'Check your email to confirm the account.' : '';
    }

    document.querySelector('#signin').onclick = () => submit('signin');
    document.querySelector('#signup').onclick = () => submit('signup');
    document.querySelector('#signout').onclick = async () => { await supabase.auth.signOut(); status.textContent = ''; };
    supabase.auth.onAuthStateChange((_event, current) => render(current));
    render((await supabase.auth.getSession()).data.session);
  </script>
</body>
</html>
