<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starting Homework</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07101e;color:#f7f9ff}.box{width:min(88vw,560px);text-align:center}h1{font-size:44px;margin:0 0 12px}p{color:#aebbd1}.track{height:18px;background:#18253a;border-radius:999px;overflow:hidden;margin:32px 0}.bar{height:100%;width:8%;border-radius:inherit;background:linear-gradient(90deg,#4ce0b3,#59a9ff);transition:width .7s ease}.error{color:#ff9f9f;min-height:24px}button{display:none;margin:20px auto;padding:13px 22px;border:0;border-radius:12px;background:#5ee1bc;color:#052019;font-weight:800}</style></head><body><main class="box"><h1>Starting your desktop</h1><p id="status">Contacting GitHub Codespaces…</p><div class="track"><div id="bar" class="bar"></div></div><div id="error" class="error"></div><button id="retry">Try again</button></main><script>let progress=8,timer;const bar=document.querySelector('#bar'),status=document.querySelector('#status'),error=document.querySelector('#error'),retry=document.querySelector('#retry');function animate(){progress=Math.min(92,progress+Math.max(1,(92-progress)*.08));bar.style.width=progress+'%'}async function check(){clearTimeout(timer);try{const r=await fetch('/api/status',{cache:'no-store'});const d=await r.json();if(r.status===401){location.replace('/');return}if(!r.ok)throw new Error(d.error||'Unable to start the desktop.');status.textContent=d.message||'Starting…';if(d.ready){bar.style.width='100%';status.textContent='Ready — opening your desktop…';setTimeout(()=>location.replace(d.url),650);return}animate();timer=setTimeout(check,d.retryAfter||3000)}catch(e){error.textContent=e.message;retry.style.display='block'}}retry.onclick=()=>{retry.style.display='none';error.textContent='';check()};setInterval(animate,900);check();</script></body></html>
